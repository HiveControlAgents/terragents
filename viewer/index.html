<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TerrAgents</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>
  :root {
    --bg: #14121a; --panel: #1f1b28; --line: #3a3348; --fg: #efe6d4; --muted: #a99f8f;
    --gold: #f2c14e; --green: #8fd16a; --red: #e8664f; --blue: #7fb8e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.4 "Pixelify Sans", ui-monospace, monospace; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 16px; align-items: baseline; padding: 10px 16px; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; color: var(--gold); letter-spacing: .04em; }
  header .st { color: var(--muted); }
  header .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--red); margin-right: 6px; }
  header .dot.on { background: var(--green); }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
  #world { position: relative; min-width: 0; background: linear-gradient(#3f74c4, #5b8fd6); overflow: hidden; }
  canvas { display: block; image-rendering: pixelated; }
  aside { border-left: 2px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  section { padding: 12px 14px; border-bottom: 2px solid var(--line); }
  section h2, .h2 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .goal { font-size: 15px; }
  .bar { height: 8px; background: #2c2638; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--green); width: 0; transition: width .4s; }
  form { display: flex; gap: 8px; margin-top: 10px; }
  input { flex: 1; min-width: 0; background: #2c2638; color: var(--fg); border: 2px solid var(--line); padding: 6px 8px; font: inherit; }
  button { background: var(--gold); color: #24180a; border: 0; padding: 6px 10px; font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: #2c2638; color: var(--fg); border: 2px solid var(--line); }
  .dec { border: 2px solid var(--gold); padding: 8px; margin-bottom: 8px; }
  .dec p { margin: 0 0 6px; }
  .dec .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  #feed { flex: 1; overflow: auto; padding: 0 14px 10px; font-size: 13px; }
  #feed div { padding: 3px 0; border-bottom: 1px dashed #2c2638; }
  #feed .merge, #feed .goal { color: var(--green); } #feed .error { color: var(--red); } #feed .ci, #feed .task { color: var(--blue); }
  #feed time { color: var(--muted); margin-right: 6px; }
  .empty { color: var(--muted); }
  .risk { margin: 0; padding: 8px 14px; font-size: 11px; color: var(--muted); border-top: 2px solid var(--line); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; grid-template-rows: 46vh minmax(0, 1fr); } aside { border-left: 0; border-top: 2px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>TerrAgents</h1>
  <span class="st"><span id="dot" class="dot"></span><span id="conn">conectando…</span></span>
  <span class="st" id="cost"></span>
</header>
<main>
  <div id="world"><canvas id="cv"></canvas></div>
  <aside>
    <section>
      <h2>Meta</h2>
      <div class="goal" id="goal"><span class="empty">nenhuma meta ainda</span></div>
      <div class="bar"><i id="prog"></i></div>
      <form id="goalForm"><input id="goalText" placeholder="Nova meta para o time" autocomplete="off"><button>Enviar</button></form>
    </section>
    <section>
      <h2>Precisa de você</h2>
      <div id="decisions"><span class="empty">nada esperando</span></div>
    </section>
    <div class="h2" style="margin:12px 14px 6px">Feed</div>
    <div id="feed"></div>
    <p class="risk">Projeto experimental. Merges automáticos e ações dos agentes são por sua conta e risco; os autores não se responsabilizam. Veja DISCLAIMER.md.</p>
  </aside>
</main>
<script>
// The browser view of the TerrAgents Core: a guild hall with one office per sector, the agents walking
// to the office of what they are doing. It only shows what the Core says (protocol v1, same origin).
const ORDER = ['meeting', 'library', 'desk', 'lounge', 'terminal', 'testbench', 'mergestation'];
const NAMES = { meeting: 'Reunião', library: 'Biblioteca', desk: 'Escritório', lounge: 'Descanso', terminal: 'Terminal', testbench: 'Testes', mergestation: 'Merge' };
const STATE_COLOR = { editing: '#8fd16a', running: '#f2c14e', testing: '#f2c14e', waiting_user: '#f29b4e', blocked: '#e8664f', error: '#e8664f', thinking: '#7fb8e8', reading: '#7fb8e8' };

const agents = new Map();   // id -> agent from the Core + x on screen
const decisions = new Map();
let ws, nextId = 1;

// ---- connection -----------------------------------------------------------------------------
function connect() {
  ws = new WebSocket(`ws://${location.host}`);
  ws.onopen = () => { send({ type: 'hello', modVersion: '0.1', protocol: 1, client: 'browser' }); setConn(true); };
  ws.onclose = () => { setConn(false); setTimeout(connect, 3000); };
  ws.onmessage = (e) => onMessage(JSON.parse(e.data));
}
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ v: 1, id: 'b' + nextId++, ...m })); }
function setConn(on) {
  document.getElementById('dot').classList.toggle('on', on);
  document.getElementById('conn').textContent = on ? 'conectado ao Core' : 'sem Core (tentando de novo)';
}

function onMessage(m) {
  switch (m.type) {
    case 'snapshot':
      agents.clear();
      for (const a of m.agents) upsertAgent(a);
      decisions.clear();
      for (const d of m.decisions) if (d.status === 'open') decisions.set(d.id, d);
      document.getElementById('feed').textContent = '';
      for (const f of m.feed.slice(-80)) addFeed(f);
      if (m.goal) setGoal(m.goal);
      setStatus(m.foreman);
      renderDecisions();
      break;
    case 'agent.upsert': upsertAgent(m.agent); break;
    case 'agent.say': bubble(m.agentId, m.text); break;
    case 'feed.add': addFeed(m.item); break;
    case 'goal.upsert': setGoal(m.goal); break;
    case 'foreman.status': setStatus(m.status); break;
    case 'decision.upsert':
      if (m.decision.status === 'open') decisions.set(m.decision.id, m.decision); else decisions.delete(m.decision.id);
      renderDecisions();
      break;
  }
}

function upsertAgent(a) {
  const old = agents.get(a.id);
  const next = { ...a, say: old && old.say, sayUntil: old && old.sayUntil, dir: old ? old.dir : 1 };
  agents.set(a.id, next);
  next.x = old ? old.x : stationX(next);
}
function bubble(id, text) { const a = agents.get(id); if (a) { a.say = text; a.sayUntil = performance.now() + 6000; } }

function setGoal(g) {
  document.getElementById('goal').textContent = g.text;
  document.getElementById('prog').style.width = Math.round((g.progress || 0) * 100) + '%';
}
function setStatus(s) {
  if (!s) return;
  document.getElementById('cost').textContent = `${s.backend === 'sim' ? 'simulado' : s.backend}${typeof s.costUsd === 'number' ? ` · US$ ${s.costUsd.toFixed(2)} estimado` : ''}`;
}
function addFeed(f) {
  const el = document.createElement('div');
  el.className = f.kind;
  const t = document.createElement('time');
  t.textContent = new Date(f.ts).toTimeString().slice(0, 5);
  el.append(t, f.text);
  const feed = document.getElementById('feed');
  feed.append(el);
  while (feed.children.length > 200) feed.firstChild.remove();
  feed.scrollTop = feed.scrollHeight;
}
function renderDecisions() {
  const box = document.getElementById('decisions');
  box.textContent = '';
  if (!decisions.size) { box.innerHTML = '<span class="empty">nada esperando</span>'; return; }
  for (const d of decisions.values()) {
    const card = document.createElement('div'); card.className = 'dec';
    const p = document.createElement('p'); p.textContent = d.question; card.append(p);
    const opts = document.createElement('div'); opts.className = 'opts';
    d.options.forEach((o, i) => {
      const b = document.createElement('button'); b.textContent = o; if (i) b.className = 'ghost';
      b.onclick = () => send({ type: 'decision.answer', decisionId: d.id, option: o });
      opts.append(b);
    });
    card.append(opts); box.append(card);
  }
}
document.getElementById('goalForm').onsubmit = (e) => {
  e.preventDefault();
  const t = document.getElementById('goalText');
  if (t.value.trim()) { send({ type: 'goal.submit', text: t.value.trim() }); t.value = ''; }
};

// ---- the hall ---------------------------------------------------------------------------------
// Logical pixels, scaled up and pixelated. One office is ROOM px wide.
const ROOM = 64, PILLAR = 6, H = 150, FLOOR = 118, CEIL = 62, LEFT = 12;
const W = ORDER.length * ROOM + PILLAR + 2 * LEFT;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scale = 3, hall = null;

function resize() {
  const box = document.getElementById('world');
  scale = Math.max(1, Math.min(box.clientWidth / W, box.clientHeight / H));
  cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
  cv.style.margin = `${Math.max(0, box.clientHeight - cv.height)}px auto 0`; // ground at the bottom, sky above
}
addEventListener('resize', resize);

function rank(a) {
  let n = 0;
  for (const o of agents.values()) if (o.active && o.station === a.station && o.id < a.id) n++;
  return n;
}
function stationX(a) {
  let i = ORDER.indexOf(a.station); if (i < 0) i = ORDER.indexOf('lounge');
  const center = LEFT + i * ROOM + PILLAR + (ROOM - PILLAR) / 2;
  const n = rank(a), side = n % 2 ? -1 : 1;
  return center + side * Math.min(((n + 1) >> 1) * 10, 26);
}

// the static hall is painted once into an offscreen canvas
function px(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }
function paintHall() {
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const c = off.getContext('2d');
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5b8fd6'); g.addColorStop(1, '#a8cdf0');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = '#7e93b8';
  for (let x = 0; x < W; x += 2) c.fillRect(x, 70 + Math.sin(x / 23) * 12 + Math.sin(x / 7) * 3, 2, H);
  c.fillStyle = '#5e7e4a';
  for (let x = 0; x < W; x += 2) c.fillRect(x, 104 + Math.sin(x / 15 + 1) * 4, 2, H);
  px(c, 0, FLOOR + 4, W, H, '#6b4a2e'); px(c, 0, FLOOR + 2, W, 3, '#4f9a3c');
  for (let x = 0; x < W; x += 3) px(c, x, FLOOR + 1 - ((x * 7) % 3), 1, 2, '#62b24a');
  // stone foundation
  px(c, LEFT - 4, FLOOR, W - 2 * LEFT + 8, 10, '#7d7d86');
  for (let y = FLOOR; y < FLOOR + 10; y += 3) for (let x = LEFT - 4 + (y % 2) * 3; x < W - LEFT + 4; x += 7) px(c, x, y, 1, 3, '#5e5e66');
  px(c, LEFT - 4, FLOOR, W - 2 * LEFT + 8, 1, '#9a9aa4');
  for (let i = 0; i < ORDER.length; i++) office(c, LEFT + i * ROOM, ORDER[i]);
  for (let i = 0; i <= ORDER.length; i++) pillar(c, LEFT + i * ROOM);
  return off;
}
function pillar(c, x) {
  px(c, x, CEIL, PILLAR, FLOOR - CEIL, '#8a8a94');
  for (let y = CEIL; y < FLOOR; y += 4) px(c, x + ((y / 4) % 2 ? 0 : 3), y, 1, 4, '#6a6a74');
  px(c, x, FLOOR - 22, PILLAR, 22, '#3b2f26'); // arch opening
  px(c, x, FLOOR - 24, PILLAR, 2, '#9a9aa4');
}
function office(c, x0, station) {
  const in0 = x0 + PILLAR, in1 = x0 + ROOM, mid = Math.round((in0 + in1) / 2);
  // back wall: wood above the trim, planks below, two glass windows
  px(c, in0, CEIL, ROOM - PILLAR, FLOOR - CEIL, '#8a5a34');
  for (let y = CEIL + 2; y < FLOOR; y += 4) px(c, in0, y, ROOM - PILLAR, 1, '#74482a');
  px(c, in0, FLOOR - 24, ROOM - PILLAR, 24, '#9c6a3e');
  for (let x = in0 + 3; x < in1; x += 6) px(c, x, FLOOR - 24, 1, 24, '#7f5230');
  px(c, in0, FLOOR - 25, ROOM - PILLAR, 2, '#5b3a22');
  for (const wx of [in0 + 6, in1 - 16]) {
    px(c, wx - 1, CEIL + 7, 12, 14, '#5b3a22'); px(c, wx, CEIL + 8, 10, 12, '#bfe3f7');
    px(c, wx + 4, CEIL + 8, 2, 12, '#5b3a22'); px(c, wx, CEIL + 13, 10, 2, '#5b3a22'); px(c, wx + 1, CEIL + 9, 2, 3, '#ffffff');
  }
  // ceiling beam and red-shingle gable roof
  px(c, x0, CEIL - 3, ROOM + PILLAR, 4, '#5b3a22');
  for (let s = 0; s < 30; s++) {
    const a = x0 - 3 + s, b = in1 + PILLAR + 3 - s; if (a >= b) break;
    const y = CEIL - 4 - s;
    px(c, a, y, b - a, 1, s % 3 === 0 ? '#9c2f24' : '#c0412f');
    px(c, a, y, 2, 1, '#7c241b'); px(c, b - 2, y, 2, 1, '#7c241b');
  }
  // chandelier and two lanterns
  px(c, mid, CEIL + 1, 1, 6, '#3d2a1a'); px(c, mid - 5, CEIL + 7, 11, 2, '#c9a227');
  for (const dx of [-5, 0, 5]) { px(c, mid + dx, CEIL + 4, 1, 3, '#fff3b0'); px(c, mid + dx, CEIL + 3, 1, 1, '#ffb347'); }
  for (const lx of [in0 + 3, in1 - 4]) { px(c, lx, CEIL + 1, 1, 4, '#3d2a1a'); px(c, lx - 1, CEIL + 5, 3, 4, '#f2c14e'); }
  furnish(c, station, in0, in1);
}
function table(c, x, w) { px(c, x, FLOOR - 9, w, 2, '#6b4226'); px(c, x + 1, FLOOR - 7, 1, 7, '#55331d'); px(c, x + w - 2, FLOOR - 7, 1, 7, '#55331d'); }
function chair(c, x) { px(c, x, FLOOR - 12, 1, 12, '#55331d'); px(c, x, FLOOR - 6, 4, 1, '#6b4226'); px(c, x + 3, FLOOR - 6, 1, 6, '#55331d'); }
function shelf(c, x) {
  px(c, x, FLOOR - 22, 9, 22, '#55331d');
  for (let y = FLOOR - 20; y < FLOOR - 1; y += 6) for (let i = 0; i < 7; i++) px(c, x + 1 + i, y, 1, 5, ['#b33a2a', '#2f6fa3', '#d9a441', '#4f9a3c'][(i + y) % 4]);
}
function clock(c, x) { px(c, x, FLOOR - 20, 5, 20, '#6b4226'); px(c, x + 1, FLOOR - 18, 3, 3, '#f5e6c8'); px(c, x + 2, FLOOR - 12, 1, 6, '#c9a227'); }
function furnish(c, s, a, b) {
  const m = Math.round((a + b) / 2);
  if (s === 'meeting') { chair(c, m - 16); table(c, m - 11, 22); chair(c, m + 13); clock(c, b - 7); }
  if (s === 'library') { shelf(c, a + 3); shelf(c, a + 14); shelf(c, b - 23); shelf(c, b - 12); }
  if (s === 'desk') { table(c, a + 5, 12); chair(c, a + 18); table(c, b - 22, 12); chair(c, b - 9); }
  if (s === 'lounge') { px(c, a + 4, FLOOR - 6, 16, 6, '#6b4226'); px(c, a + 4, FLOOR - 8, 6, 3, '#e9e2d0'); px(c, a + 9, FLOOR - 7, 11, 3, '#2f6fa3'); px(c, m + 6, FLOOR - 10, 12, 10, '#2a2a30'); px(c, m + 6, FLOOR - 10, 12, 2, '#f5f5f5'); }
  if (s === 'terminal') for (const x of [a + 5, b - 20]) { table(c, x, 12); px(c, x + 3, FLOOR - 17, 7, 6, '#2a2a30'); px(c, x + 4, FLOOR - 16, 5, 4, '#57e389'); }
  if (s === 'testbench') { for (const x of [a + 6, b - 18]) { px(c, x, FLOOR - 6, 10, 3, '#55555f'); px(c, x + 3, FLOOR - 3, 4, 3, '#44444c'); } table(c, m - 5, 10); px(c, m - 3, FLOOR - 13, 2, 4, '#7fb8e8'); px(c, m + 1, FLOOR - 13, 2, 4, '#e8664f'); }
  if (s === 'mergestation') { clock(c, a + 4); table(c, m - 6, 14); px(c, m - 2, FLOOR - 13, 6, 4, '#f2c14e'); shelf(c, b - 12); }
}

// one agent: 8x16 px, coloured shirt, two-frame walk
function drawAgent(c, a, t) {
  const x = Math.round(a.x), y = FLOOR - 16, f = a.moving ? Math.floor(t / 180) % 2 : 0, dir = a.dir || 1;
  px(c, x - 4, y + 15, 8, 1, 'rgba(0,0,0,.25)');
  px(c, x - 3, y, 6, 3, '#6b3f1f');
  px(c, x - 3, y + 3, 6, 4, '#f1c29a');
  px(c, x + (dir > 0 ? 1 : -2), y + 4, 1, 1, '#2a1a10');
  px(c, x - 4, y + 7, 8, 5, a.color || '#888');
  px(c, x - 3, y + 12, 6, 2, '#3b3f5c');
  px(c, x - 3 + f, y + 14, 2, 2, '#2a1a10'); px(c, x + 1 - f, y + 14, 2, 2, '#2a1a10');
}
function outline(text, x, y, col) {
  ctx.lineWidth = 3; ctx.strokeStyle = '#120f18'; ctx.strokeText(text, x, y);
  ctx.fillStyle = col; ctx.fillText(text, x, y);
}
function label(a, t) {
  const lift = (rank(a) % 3) * 26; // three label rows, so neighbours never overlap
  const sx = a.x * scale, sy = (FLOOR - 20) * scale - lift;
  ctx.textAlign = 'center';
  ctx.font = `600 ${Math.max(11, Math.round(scale * 4.2))}px "Pixelify Sans", monospace`;
  outline(a.name, sx, sy - Math.round(scale * 5), a.color || '#fff');
  let act = a.paused ? 'pausado' : a.activity || '';
  if (act.length > 22) act = act.slice(0, 21) + '…';
  ctx.font = `${Math.max(10, Math.round(scale * 3.4))}px "Pixelify Sans", monospace`;
  outline(act, sx, sy, STATE_COLOR[a.state] || '#d8d2c4');
  if (a.say && t < a.sayUntil) {
    const s = a.say.length > 46 ? a.say.slice(0, 45) + '…' : a.say;
    const w = ctx.measureText(s).width + 14, by = sy - Math.round(scale * 11) - 22;
    ctx.fillStyle = '#fffaf0'; ctx.fillRect(sx - w / 2, by, w, 20);
    ctx.fillStyle = '#1f1b28'; ctx.fillText(s, sx, by + 15);
  }
}
function roomNames() {
  ctx.textAlign = 'center';
  ctx.font = `600 ${Math.max(11, Math.round(scale * 4))}px "Pixelify Sans", monospace`;
  ORDER.forEach((s, i) => outline(NAMES[s], (LEFT + i * ROOM + PILLAR + (ROOM - PILLAR) / 2) * scale, (CEIL - 35) * scale, '#fff'));
}

let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (document.hidden || t - last < 33) return; // ~30 fps, nothing at all while the tab is hidden
  const dt = Math.min(100, t - last); last = t;
  if (!hall) hall = paintHall();
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.drawImage(hall, 0, 0);
  const shown = [...agents.values()].filter((a) => a.active);
  for (const a of shown) {
    const dx = stationX(a) - a.x;
    const speed = (a.state === 'running' || a.state === 'testing' ? 0.05 : 0.03) * dt;
    a.moving = !a.paused && Math.abs(dx) > 0.6;
    if (a.moving) { a.dir = Math.sign(dx); a.x += Math.sign(dx) * Math.min(Math.abs(dx), speed); }
    drawAgent(ctx, a, t);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  roomNames();
  for (const a of shown) label(a, t);
}

resize();
connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
